<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard de Solicitações</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            /* Adicionando as variáveis de gradiente */
            --color-bg-gradient-start: #e0f2f7;
            --color-bg-gradient-end: #e8f5e9;

            --color-sidebar-start: #22c55e;
            --color-sidebar-end: #16bd53;
            --color-green-action: #22c55e;
            --color-green-dark: #16a34a;
            --color-red-danger: #ef4444;
            --color-blue-link: #3b82f6;
            --color-text-dark: #1f2937;
            --color-text-medium: #4b5563;
            --color-border: #d1d5db;
            --color-card-bg: #ffffff;
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }

        body {
            font-family: 'Inter', sans-serif;
            /* Aplicando o fundo em gradiente */
            background: linear-gradient(to bottom right, var(--color-bg-gradient-start), var(--color-bg-gradient-end));
            background-attachment: fixed;
            color: var(--color-text-dark);
        }

        .sidebar {
            background: linear-gradient(to bottom, var(--color-sidebar-start), var(--color-sidebar-end));
            transition: all 0.5s ease-in-out;
            box-shadow: var(--shadow-lg);
            border-right: 1px solid rgba(0, 0, 0, 0.1);
        }

        .icon-only {
            display: flex;
            align-items: center;
            height: 60px;
            font-size: 24px;
            color: var(--color-text-dark);
            transition: background-color 0.3s ease, color 0.3s ease;
            white-space: nowrap;
            overflow: hidden;
            padding-left: 1.25rem;
            padding-right: 1.25rem;
            box-sizing: border-box;
            justify-content: flex-start;
        }

        .sidebar button:hover {
            background-color: rgba(0, 0, 0, 0.15);
            color: white;
        }

        .sidebar button.active {
            background-color: rgba(0, 0, 0, 0.2);
            color: white;
            font-weight: 600;
        }

        .sidebar-text {
            margin-left: 15px;
            font-weight: 600;
            opacity: 0;
            display: inline-block;
            width: 0;
            overflow: hidden;
            transition: opacity 0.3s ease 0.2s, width 0.3s ease 0.2s;
        }

        .sidebar-text.active-text {
            opacity: 1;
            width: auto;
        }

        .ml-\[60px\] {
            transition: margin-left 0.5s ease-in-out;
        }

        .card {
            background-color: var(--color-card-bg);
            border-radius: 0.75rem;
            box-shadow: var(--shadow-md);
            padding: 1.5rem;
            border: 1px solid var(--color-border);
        }

        canvas {
            max-width: 100%;
            height: auto;
        }

        /* TÍTULO PADRONIZADO (GRANDE) */
        h1 {
            font-size: 5.5rem;
            line-height: 1;
            font-weight: 900;
            color: var(--color-text-dark);
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.15);
        }
    </style>
</head>

<body class="font-inter flex">
    <div id="sidebar" class="sidebar h-screen w-[60px] fixed overflow-hidden rounded-r-xl">
        <button class="w-full p-5 text-left icon-only" title="Solicitações"
            onclick="location.href='../frontend.html'">📋 <span class="sidebar-text hidden">Solicitações</span></button>
        <button class="w-full p-5 text-left icon-only active" title="Dashboard" onclick="location.reload()">📊 <span
                class="sidebar-text hidden">Dashboard</span></button>
        <button class="w-full p-5 text-left icon-only" title="Clientes" onclick="location.href='clientes.html'">👥 <span
                class="sidebar-text hidden">Clientes</span></button>
        <button class="w-full p-5 text-left icon-only" title="Configurar Trello"
            onclick="location.href='trello_config.html'">⚙️ <span class="sidebar-text hidden">Configurar
                Trello</span></button>
        <button class="w-full p-5 text-left icon-only" title="Histórico" onclick="location.href='historico.html'">🕒
            <span class="sidebar-text hidden">Histórico</span></button>
    </div>

    <div class="ml-[60px] transition-all duration-300 w-full p-8">
        <div class="max-w-6xl mx-auto">

            <div>
                <div class="flex items-center gap-3">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 text-gray-600" fill="none"
                        viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" />
                    </svg>
                    <h1 class="text-4xl md:text-5xl mb-0">Dashboard</h1>
                </div>
                <p class="mt-1 text-lg text-gray-500">
                    Visualize as métricas e estatísticas das solicitações de design e vídeo.
                </p>

                <div
                    class="my-6 flex flex-col md:flex-row items-center gap-4 p-4 bg-white rounded-lg shadow-sm border border-gray-200">
                    <div class="flex items-center gap-2">
                        <label for="filterMonth" class="font-semibold text-gray-700">Mês:</label>
                        <select id="filterMonth"
                            class="p-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-green-500">]
                            <option value="todos">Todos os Meses</option> 
                            <option value="1">Janeiro</option>
                            <option value="2">Fevereiro</option>
                            <option value="3">Março</option>
                            <option value="4">Abril</option>
                            <option value="5">Maio</option>
                            <option value="6">Junho</option>
                            <option value="7">Julho</option>
                            <option value="8">Agosto</option>
                            <option value="9">Setembro</option>
                            <option value="10">Outubro</option>
                            <option value="11">Novembro</option>
                            <option value="12">Dezembro</option>
                        </select>
                    </div>
                    <div class="flex items-center gap-2">
                        <label for="filterYear" class="font-semibold text-gray-700">Ano:</label>
                        <select id="filterYear"
                            class="p-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-green-500">
                            <option value="2025">2025</option>
                            <option value="2024">2024</option>
                            <option value="2023">2023</option>
                        </select>
                    </div>
                    <button id="filterButton"
                        class="w-full md:w-auto bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-6 rounded-md transition duration-300">
                        Filtrar
                    </button>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 mb-8">
                </div>


                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 mb-8">
                    <div class="card flex flex-col items-center justify-center p-6 text-center">
                        <div class="text-5xl font-bold text-gray-800" id="totalCards">0</div>
                        <div class="text-lg text-gray-600 mt-2">Solicitações Recebidas</div>
                    </div>

                    <div class="card flex flex-col items-center justify-center p-6 text-center">
                        <div class="text-5xl font-bold text-green-600" id="cardsAceitos">0</div>
                        <div class="text-lg text-gray-600 mt-2">Solicitações Aceitas</div>
                    </div>

                    <div class="card flex flex-col items-center justify-center p-6 text-center">
                        <div class="text-5xl font-bold text-red-600" id="cardsRejeitados">0</div>
                        <div class="text-lg text-gray-600 mt-2">Solicitações Rejeitadas</div>
                    </div>

                    <div class="card flex flex-col items-center justify-center p-6 text-center">
                        <div class="text-5xl font-bold text-blue-600" id="cardsMovidos">0</div>
                        <div class="text-lg text-gray-600 mt-2">Solicitações Concluídas</div>
                    </div>

                    <div
                        class="card flex flex-col items-center justify-center p-6 text-center md:col-span-2 lg:col-span-1">
                        <div class="text-xl font-bold text-gray-800" id="clienteMaisPedidosNome">N/A</div>
                        <div class="text-lg text-gray-600 mt-2">Cliente com Mais Pedidos (<span
                                id="clienteMaisPedidosCount">0</span>)</div>
                    </div>
                </div>

                <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                    <div class="card p-6">
                        <h3 class="text-xl font-bold mb-4 text-gray-800">Tipos de Solicitação</h3>
                        <canvas id="solicitationTypesChart"></canvas>
                    </div>

                    <div class="card p-6">
                        <h3 class="text-xl font-bold mb-4 text-gray-800">Status das Solicitações</h3>
                        <canvas id="solicitationStatusChart"></canvas>
                    </div>
                </div>
            </div>
        </div>

        <script src="./js/dashboard.js"></script>
        <script>
            document.body.addEventListener('mousemove', function (e) {
                const openThreshold = 50;
                const closeThreshold = 300;

                if (e.clientX < openThreshold) {
                    expandirSidebar();
                } else if (e.clientX > closeThreshold) {
                    voltarSidebar();
                }
            });

            function expandirSidebar() {
                const sidebar = document.getElementById('sidebar');
                if (sidebar.classList.contains('w-[300px]')) return;

                sidebar.classList.remove('w-[60px]');
                sidebar.classList.add('w-[300px]');
                const botoes = sidebar.querySelectorAll('.icon-only');
                botoes.forEach(button => {
                    const spanText = button.querySelector('.sidebar-text');
                    if (spanText) {
                        spanText.classList.remove('hidden');
                        setTimeout(() => {
                            spanText.classList.add('active-text');
                        }, 300);
                    }
                });
            }

            function voltarSidebar() {
                const sidebar = document.getElementById('sidebar');
                if (sidebar.classList.contains('w-[60px]')) return;

                sidebar.classList.remove('w-[300px]');
                sidebar.classList.add('w-[60px]');
                const botoes = sidebar.querySelectorAll('.icon-only');
                botoes.forEach(button => {
                    const spanText = button.querySelector('.sidebar-text');
                    if (spanText) {
                        spanText.classList.remove('active-text');
                        setTimeout(() => {
                            spanText.classList.add('hidden');
                        }, 300);
                    }
                });
            }
        </script>
</body>

</html>
